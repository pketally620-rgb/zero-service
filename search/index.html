<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO職人鍍膜 | 電子保固查詢系統</title>
<style>
  :root {
    --bg-base: #0a0b10;
    --bg-card: #151720;
    --bg-input: #0f1118;
    --gold-gradient: linear-gradient(135deg, #c59b27 0%, #fcf6ba 40%, #c59b27 80%, #aa771c 100%);
    --gold-solid: #d4af37;
    --gold-dim: rgba(212, 175, 55, 0.1);
    
    --film-gradient: linear-gradient(135deg, #38bdf8 0%, #bae6fd 40%, #0ea5e9 80%, #0284c7 100%);
    --film-solid: #38bdf8;
    --film-dim: rgba(56, 189, 248, 0.1);

    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border-metal: #2a2d3d;
    --success: #10b981;
    --danger: #ef4444;
  }

  body { 
    font-family: 'Helvetica Neue', 'Segoe UI', Tahoma, Geneva, sans-serif; 
    background: radial-gradient(ellipse at top, #1a1d2b 0%, var(--bg-base) 80%);
    color: var(--text-main); 
    margin: 0; 
    padding: 30px 20px; 
    display: flex; 
    justify-content: center; 
    min-height: 100vh;
  }
  .container { width: 100%; max-width: 800px; position: relative; }

  .text-metallic {
    background: var(--gold-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0px 2px 10px rgba(197, 155, 39, 0.2);
  }

  /* --- 頂部搜尋區 --- */
  .search-section { 
    background: linear-gradient(145deg, var(--bg-card), #10121a);
    padding: 40px 30px; 
    border-radius: 16px; 
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    margin-bottom: 30px;
    text-align: center;
    position: relative;
  }
  
  .title-area { margin-bottom: 30px; }
  .main-title { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: 1px; }
  .sub-title { display: block; font-size: 14px; color: var(--text-muted); margin-top: 8px; letter-spacing: 2px; }

  .search-box { display: flex; gap: 12px; max-width: 480px; margin: 0 auto; }
  .search-input { flex: 1; padding: 15px 20px; background-color: var(--bg-input); border: 1px solid var(--border-metal); color: var(--text-main); border-radius: 8px; font-size: 16px; outline: none; transition: all 0.3s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
  .search-input:focus { border-color: var(--gold-solid); box-shadow: 0 0 0 1px var(--gold-solid), inset 0 2px 4px rgba(0,0,0,0.5); }
  .btn-search { padding: 0 28px; background: var(--gold-gradient); color: #1a1500; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(197, 155, 39, 0.2); }
  .btn-search:hover { filter: brightness(1.15); transform: translateY(-1px); }

  /* --- 管理員按鈕與彈出視窗 --- */
  .btn-admin-toggle { position: absolute; top: 25px; right: 25px; background: none; border: 1px solid var(--border-metal); color: var(--text-muted); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.3s; }
  .btn-admin-toggle:hover { border-color: var(--gold-solid); color: var(--gold-solid); background: var(--gold-dim); }

  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
  .modal-box { background: var(--bg-card); border: 1px solid #334155; border-radius: 12px; padding: 25px; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
  .modal-title { color: var(--text-main); font-size: 15px; margin-top: 0; margin-bottom: 15px; font-weight: normal; }
  .modal-input { width: 100%; padding: 12px 15px; background: var(--bg-input); border: 1px solid var(--text-muted); color: var(--text-main); border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 25px; outline: none; transition: 0.3s; }
  .modal-input:focus { border-color: var(--gold-solid); box-shadow: 0 0 0 1px var(--gold-solid); }
  .modal-buttons { display: flex; justify-content: flex-end; gap: 12px; }
  .btn-modal { padding: 8px 22px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; transition: 0.2s; }
  .btn-cancel { background: #334155; color: var(--text-main); }
  .btn-cancel:hover { background: #475569; }
  .btn-confirm { background: #cbd5e1; color: #0f1118; font-weight: bold; }
  .btn-confirm:hover { background: #f1f5f9; }

  /* --- 後台管理區 --- */
  .admin-panel { display: none; background: #0c0d12; border: 1px solid #059669; border-radius: 12px; padding: 25px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
  .admin-panel h3 { margin-top: 0; color: #34d399; border-bottom: 1px solid var(--border-metal); padding-bottom: 15px; }
  
  .mode-toggle-box { display: flex; gap: 10px; margin-bottom: 20px; }
  .btn-mode { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-metal); background: var(--bg-input); color: var(--text-muted); font-weight: bold; cursor: pointer; transition: 0.3s; }
  .btn-mode.active-coating { background: var(--gold-dim); border-color: var(--gold-solid); color: var(--gold-solid); }
  .btn-mode.active-film { background: var(--film-dim); border-color: var(--film-solid); color: var(--film-solid); }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .form-group { display: flex; flex-direction: column; }
  .form-group label { margin-bottom: 8px; font-size: 13px; font-weight: bold; letter-spacing: 0.5px; transition: 0.3s; }
  .form-group input, .form-group select { padding: 12px; background-color: var(--bg-input); border: 1px solid var(--border-metal); color: var(--text-main); border-radius: 6px; font-size: 14px; outline: none; color-scheme: dark; }
  .form-group input:focus, .form-group select:focus { border-color: var(--gold-solid); }
  .btn-save-record { background: #059669; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s;}
  .btn-save-record:hover { background: #047857; }
  .btn-save-record:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

  /* --- VIP 電子保固卡展示區 (共用樣式) --- */
  .card-container { display: none; gap: 25px; flex-direction: column; }
  .warranty-card { background: linear-gradient(135deg, #161824 0%, #0b0c13 100%); border: 1px solid var(--border-metal); border-radius: 16px; padding: 35px; box-shadow: 0 25px 50px rgba(0,0,0,0.9); position: relative; overflow: hidden; }
  .warranty-card::before { content: ''; position: absolute; top: 0; left: -50%; width: 200%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0) 100%); transform: rotate(30deg); pointer-events: none; }
  
  .card-coating { border-color: var(--gold-solid); box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.1); }
  .card-coating .card-logo span { color: var(--gold-solid); }
  .card-coating .highlight-value { color: var(--gold-solid); font-family: 'Arial', sans-serif; letter-spacing: 0.5px; }
  
  .card-film { border-color: var(--film-solid); box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 20px rgba(56, 189, 248, 0.1); }
  .card-film .card-logo span { color: var(--film-solid); }
  .card-film .highlight-value { color: var(--film-solid); font-family: 'Arial', sans-serif; letter-spacing: 0.5px; }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 20px; margin-bottom: 25px; }
  .card-logo { font-size: 20px; font-weight: 900; color: var(--text-main); letter-spacing: 1px; }
  .badge-title { font-size: 13px; padding: 4px 10px; background: rgba(255,255,255,0.1); border-radius: 6px; margin-left: 10px; vertical-align: middle; }
  
  .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
  .status-active { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
  .status-expired { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 30px; }
  .info-item { display: flex; flex-direction: column; }
  .info-label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; letter-spacing: 1px; }
  .info-value { font-size: 16px; font-weight: bold; color: var(--text-main); }
  
  .reminder-item { grid-column: 1 / -1; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px; border: 1px dashed rgba(255, 255, 255, 0.2); margin-top: 5px; }
  .reminder-value { color: #fb923c; font-size: 17px; font-weight: 800; }

  .alert-box { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); padding: 15px; border-radius: 8px; color: #fca5a5; font-weight: bold; font-size: 14px; line-height: 1.5; margin: 30px 0 0 0; text-align: justify; }
  
  .card-footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-metal); display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
  .card-coating .shop-phone { color: var(--gold-solid); font-weight: bold; }
  .card-film .shop-phone { color: var(--film-solid); font-weight: bold; }

  .error-msg { display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: #fca5a5; padding: 15px; border-radius: 8px; font-size: 14px; text-align: center; margin-bottom: 20px; }
  .btn-back-lobby { display: inline-block; margin-top: 25px; color: var(--text-muted); text-decoration: none; font-size: 14px; transition: 0.2s; }
  .btn-back-lobby:hover { color: var(--gold-solid); }

  @media (max-width: 768px) { .info-grid { grid-template-columns: 1fr; gap: 15px; } .card-footer { flex-direction: column; gap: 10px; } }
</style>
