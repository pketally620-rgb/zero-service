<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO職人鍍膜_XPEL竹北授權店 | 智慧報價系統</title>
<style>
  :root {
    --bg-base: #0a0b10;
    --bg-card: #151720;
    --bg-input: #0f1118;
    --gold-gradient: linear-gradient(135deg, #c59b27 0%, #fcf6ba 40%, #c59b27 80%, #aa771c 100%);
    --gold-solid: #d4af37;
    --gold-dim: rgba(212, 175, 55, 0.15);
    --vip-gradient: linear-gradient(135deg, #ea580c 0%, #fb923c 50%, #ea580c 100%);
    --vip-solid: #f97316;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border-metal: #2a2d3d;
    --border-light: rgba(255, 255, 255, 0.08);
    --success: #10b981;
  }

  body { 
    font-family: 'Helvetica Neue', 'Segoe UI', Tahoma, Geneva, sans-serif; 
    background: radial-gradient(ellipse at top, #1a1d2b 0%, var(--bg-base) 80%);
    color: var(--text-main); margin: 0; padding: 30px 20px; display: flex; justify-content: center; min-height: 100vh;
  }
  .container { width: 100%; max-width: 1000px; position: relative; }

  .text-metallic { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0px 2px 10px rgba(197, 155, 39, 0.2); }

  .input-section { 
    background: linear-gradient(145deg, var(--bg-card), #10121a); padding: 35px; border-radius: 16px; 
    border: 1px solid var(--border-light); box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05); margin-bottom: 30px; position: relative; 
  }
  
  .brand-title { margin-top: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px; border-bottom: 1px solid var(--border-metal); padding-bottom: 20px; margin-bottom: 25px; }
  .brand-subtitle { display: block; font-size: 15px; color: var(--text-muted); font-weight: normal; letter-spacing: 2px; margin-top: 8px; -webkit-text-fill-color: var(--text-muted); }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 18px; margin-bottom: 25px; }
  .form-group { display: flex; flex-direction: column; }
  .form-group label { margin-bottom: 8px; font-size: 13px; color: var(--gold-solid); font-weight: bold; letter-spacing: 0.5px;}
  .form-group input, .form-group select { 
    padding: 14px; background-color: var(--bg-input); border: 1px solid var(--border-metal); color: var(--text-main); 
    border-radius: 8px; font-size: 15px; outline: none; color-scheme: dark; transition: all 0.3s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--gold-solid); box-shadow: 0 0 0 1px var(--gold-solid), inset 0 2px 4px rgba(0,0,0,0.5); }
  
  .btn-admin-toggle { position: absolute; top: 35px; right: 35px; background: none; border: 1px solid var(--border-metal); color: var(--text-muted); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.3s; }
  .btn-admin-toggle:hover { border-color: var(--gold-solid); color: var(--gold-solid); background: var(--gold-dim); }

  .btn-generate {
    width: 100%; padding: 18px; background: var(--gold-gradient); color: #1a1500; border: none; border-radius: 8px; 
    font-size: 18px; font-weight: 900; letter-spacing: 1px; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 20px rgba(197, 155, 39, 0.3), inset 0 1px 1px rgba(255,255,255,0.8);
  }
  .btn-generate:hover { filter: brightness(1.15); transform: translateY(-1px); }

  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
  .modal-box { background: var(--bg-card); border: 1px solid #334155; border-radius: 12px; padding: 25px; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
  .modal-title { color: var(--text-main); font-size: 15px; margin-top: 0; margin-bottom: 15px; font-weight: normal; }
  .modal-input { width: 100%; padding: 12px 15px; background: var(--bg-input); border: 1px solid var(--text-muted); color: var(--text-main); border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 25px; outline: none; transition: 0.3s; }
  .modal-input:focus { border-color: var(--gold-solid); box-shadow: 0 0 0 1px var(--gold-solid); }
  .modal-buttons { display: flex; justify-content: flex-end; gap: 12px; }
  .btn-modal { padding: 8px 22px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; transition: 0.2s; }
  .btn-cancel { background: #334155; color: var(--text-main); }
  .btn-cancel:hover { background: #475569; }
  .btn-confirm { background: #cbd5e1; color: #0f1118; font-weight: bold; }
  .btn-confirm:hover { background: #f1f5f9; }

  /* --- 後台管理區 --- */
  .admin-panel { display: none; background: #0c0d12; border: 1px solid #059669; border-radius: 12px; padding: 25px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
  .admin-panel h3 { margin-top: 0; color: #34d399; border-bottom: 1px solid var(--border-metal); padding-bottom: 15px; }
  .admin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
  .admin-grid input { padding: 12px; background: var(--bg-input); color: white; border: 1px solid var(--border-metal); border-radius: 6px;}
  .admin-subtitle { color: var(--gold-solid); font-size: 16px; margin-bottom: 10px; border-left: 4px solid var(--gold-solid); padding-left: 10px; margin-top: 25px; font-weight: bold;}
  .price-setting-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: #13151d; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border-metal); }
  .price-setting-grid input { padding: 12px; background: var(--bg-base); color: white; border: 1px solid var(--border-metal); border-radius: 6px; width: 100%; box-sizing: border-box;}
  .btn-save-price { background: #059669; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.2s;}
  .btn-save-price:hover { background: #047857; }
  .btn-save-price:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

  /* --- 報價單展示區 --- */
  .quote-result { display: none; background: linear-gradient(145deg, var(--bg-card), #10121a); padding: 50px; border-radius: 16px; border: 1px solid var(--border-light); box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05); position: relative; }
  .quote-header { text-align: center; margin-bottom: 50px; }
  .quote-header h2 { font-size: 32px; margin: 0 0 20px 0; letter-spacing: 3px; font-weight: 800; }
  .car-info-display { font-size: 20px; color: #fff; background: var(--gold-dim); display: inline-block; padding: 12px 30px; border-radius: 50px; border: 1px solid var(--gold-solid); font-weight: bold; letter-spacing: 1px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.1); }
  .price-status-tag { display: block; font-size: 13px; color: var(--success); margin-top: 15px; }
  .plan-category { margin-bottom: 50px; }
  .category-title { font-size: 24px; color: var(--gold-solid); border-left: 5px solid var(--gold-solid); padding-left: 15px; margin-bottom: 8px; font-weight: 900; letter-spacing: 1px;}
  .category-target { color: var(--text-muted); font-size: 15px; margin-bottom: 25px; padding-left: 20px; }
  .plan-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
  .card { background: linear-gradient(145deg, #181a24, #12141c); border: 1px solid var(--border-metal); border-radius: 12px; padding: 30px; box-shadow: 5px 5px 15px #0a0b0f, -5px -5px 15px #1c1f2b; transition: 0.3s; }
  .card:hover { border-color: rgba(212, 175, 55, 0.4); box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
  .card-title { font-size: 19px; font-weight: bold; color: var(--text-main); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-metal); padding-bottom: 15px;}
  .price { font-size: 26px; color: var(--gold-solid); font-weight: 900; font-family: 'Arial', sans-serif;}
  .card ul { list-style: none; padding: 0; margin: 0; }
  .card li { margin-bottom: 12px; font-size: 15px; color: #cbd5e1; display: flex; line-height: 1.5;}
  .card li.bullet::before { content: '❖'; color: var(--gold-solid); font-size: 12px; margin-right: 8px; margin-top: 3px;}
  .menu-item { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px dashed var(--border-metal); padding-bottom: 12px; margin-bottom: 12px; }
  .menu-item span { font-weight: bold; color: var(--gold-solid); font-size: 18px; font-family: 'Arial', sans-serif;}
  .list-header { color: var(--text-main); font-weight: bold; margin-top: 20px; margin-bottom: 15px; font-size: 15px; text-align: center; background: var(--border-metal); padding: 8px; border-radius: 6px; letter-spacing: 1px;}
  .vip-header { background: var(--vip-gradient) !important; color: #fff !important; border: none !important; box-shadow: 0 4px 15px rgba(234, 88, 12, 0.3); font-size: 16px !important; padding: 10px !important; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  .vip-note { display: block; color: #fed7aa; font-size: 12px; font-weight: normal; margin-top: 4px; text-shadow: none; }
  .vip-item span { color: var(--vip-solid) !important; }
  .glass-header { background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #1e293b 100%) !important; color: var(--gold-solid) !important; border: 1px solid var(--gold-solid) !important; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15); font-size: 15px !important; padding: 10px !important; text-shadow: 0 1px 2px rgba(0,0,0,0.8); letter-spacing: 1px; font-weight: bold; text-align: center; border-radius: 6px; }
  .footer-notes { margin-top: 50px; padding-top: 25px; border-top: 1px solid var(--border-metal); color: var(--text-muted); font-size: 14px; line-height: 1.8; text-align: center; }
  .btn-print { background: #1e293b; color: white; border: 1px solid var(--border-metal); padding: 10px 20px; border-radius: 8px; cursor: pointer; position: absolute; right: 50px; top: 50px; transition: 0.3s; }
  .btn-print:hover { background: #334155; border-color: var(--text-muted); }
  .btn-back-lobby { display: inline-block; margin-top: 25px; color: var(--text-muted); text-decoration: none; font-size: 14px; transition: 0.2s; }
  .btn-back-lobby:hover { color: var(--gold-solid); }

  @media (max-width: 768px) { .plan-cards { grid-template-columns: 1fr; } .admin-grid { grid-template-columns: 1fr; } .btn-print { position: static; float: right; margin-bottom: 20px;} }
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    @page { margin: 5mm; size: A4 portrait; }
    body { background: #0a0b10 !important; color: #f1f5f9 !important; padding: 0 !important; font-size: 10px !important; }
    .input-section, .admin-panel, .btn-print, .price-status-tag, .btn-back-lobby { display: none !important; }
    .quote-result { display: block !important; border: none !important; padding: 3mm !important; box-shadow: none !important; }
    /* ... 保留原有列印排版 ... */
  }
</style>
