<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZERO 職人｜管理中心</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body><header><a class="brand" href="/">ZERO<span>職人</span></a><span>管理中心</span></header><main class="shell admin-main"><p class="note">受控預覽：目前皆為測試資料，不會接受正式預約。</p><form id="login" class="panel"><h1>登入管理中心</h1><label>管理密碼<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="btn primary">登入</button></form><p id="message" role="status"></p><div id="workspace" hidden><div class="actions"><button id="reload" class="btn">重新載入</button><button id="logout" class="btn">登出</button><a class="btn" href="/" target="_blank" rel="noopener">查看網站 ↗</a></div><nav class="admin-nav"><a href="#bookings">預約</a><a href="#services">服務價格</a><a href="#vehicles">車款分類</a><a href="#cases">案例與連結</a></nav><section id="bookings"><h2>預約與時段</h2><details class="panel"><summary>替 LINE／電話／現場客人建立需求</summary><div id="manualBooking"></div></details><div id="bookingRows"></div><details class="panel"><summary>新增／調整可預約時段</summary><form id="newSlot"><label>日期<input name="date" type="date" required></label><label>時間<input name="time" type="time" required></label><button class="btn primary">新增開放時段</button></form><div id="slotRows"></div></details></section><section id="services"><h2>服務與基準價格</h2><p>服務變更不影響已送出預約的名稱與基準價。停用可隨時恢復，不刪除預約歷史。</p><details class="panel"><summary>新增服務</summary><div id="newService"></div></details><div id="serviceRows"></div></section><section id="vehicles"><h2>車款與分類</h2><div id="vehicleRows"></div></section><section id="cases"><h2>施工案例與官方連結</h2><p>首頁只顯示啟用案例的前兩筆。可儲存更多案例，再以順序決定首頁呈現。</p><form id="contentForm"><div class="panel"><h3>主打施工紀錄</h3><div id="featured"></div></div><div class="panel"><h3>其他案例</h3><div id="caseRows"></div><button type="button" id="addCase" class="btn">新增案例</button></div><div class="panel"><h3>官方連結</h3><div id="linkFields"></div><p>LINE 帳號 ID 必須與官方 LINE 連結屬於同一帳號，儲存前請確認。</p></div><button class="btn primary">儲存案例與連結</button></form></section></div></main><script type="module" src="/admin.mjs"></script></body></html>
